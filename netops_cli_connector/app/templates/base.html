<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetOps CLI Connector</title>
  <link rel="stylesheet" href="/static/style.css?v=2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/">
          <span class="brand-dot"></span>
          NetOps CLI
        </a>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="/">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </a>
        <a class="nav-item" href="/wireguard">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          WAN / WireGuard
        </a>
        <a class="nav-item" href="/l2tp-ipsec">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          LAN / L2TP IPsec
        </a>
        <a class="nav-item" href="/routes">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h6a3 3 0 0 1 3 3v6"/></svg>
          Rotas
        </a>
        <a class="nav-item" href="/nat">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
          NAT / Firewall
        </a>
        <a class="nav-item" href="/diagnostics">
          <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Diagnósticos
        </a>
      </nav>
      <div class="sidebar-footer">
        <form method="post" action="/logout">
          <button type="submit" class="btn-logout">
            <svg style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
          </button>
        </form>
      </div>
    </aside>
    <main class="content-area">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const currentPath = window.location.pathname;
      const navItems = document.querySelectorAll(".nav-item");
      navItems.forEach(item => {
        const itemHref = item.getAttribute("href");
        if (itemHref === currentPath || (itemHref !== "/" && currentPath.startsWith(itemHref))) {
          item.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
